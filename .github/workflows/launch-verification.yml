name: Independent production verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/launch-verification.yml
      - scripts/test-live-smoke.mjs
      - scripts/test-in-app-auth.mjs
permissions:
  contents: read
jobs:
  public-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check custom domain with normal browser networking
        run: node scripts/test-live-smoke.mjs
        env:
          TEST_BASE_URL: https://bajihears.app
      - name: Check production Worker with normal browser networking
        run: node scripts/test-live-smoke.mjs
        env:
          TEST_BASE_URL: https://bajihears.mugheestayyab4.workers.dev
      - name: Verify actual consented Analytics collection and withdrawal
        run: node scripts/test-live-analytics.mjs
      - name: Verify Instagram browser handoff without starting embedded OAuth
        run: node scripts/test-in-app-auth.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: public-verification-evidence
          path: artifacts/live-analytics-receipts.json
          if-no-files-found: ignore
          retention-days: 7
  browser-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prepare public browser configuration
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync, appendFileSync} from 'node:fs';
          const {vars} = JSON.parse(readFileSync('wrangler.json', 'utf8'));
          for (const name of ['SUPABASE_URL', 'SUPABASE_ANON_KEY', 'VAPID_PUBLIC_KEY']) {
            const value = vars[name];
            if (!value || /[\r\n]/.test(value)) throw new Error('Invalid public configuration');
            appendFileSync(process.env.GITHUB_ENV, `VITE_${name}=${value}\n`);
          }
          NODE
      - name: Build server-function fixture map
        run: npm run build > /tmp/bajihears-build.log 2>&1
      - name: Install official browser runtime
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Test deployed UI without production writes
        run: node scripts/test-browser.mjs
        env:
          TEST_BASE_URL: https://bajihears.app
          TEST_BROWSER_ENGINE: ${{ matrix.engine }}
          TEST_NORMAL_NETWORK: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-regression-${{ matrix.engine }}
          path: artifacts/browser*
          if-no-files-found: ignore
          retention-days: 7
