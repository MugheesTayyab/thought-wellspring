<!doctype html>
<html lang="en">

    <title>You're offline | BajiHears</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: #faf7f3; color: #352722; font-family: system-ui, sans-serif; }
      main { width: 100%; max-width: 420px; padding: 32px; border: 1px solid #e8dcd5; border-radius: 24px; background: #fffdfb; }
      p { line-height: 1.6; }
      .brand { color: #ae4031; font-weight: 700; }
      h1 { font-size: 1.75rem; }
      a { display: inline-flex; min-height: 48px; align-items: center; margin-top: 12px; padding: 12px 20px; border-radius: 12px; background: #ae4031; color: white; text-decoration: none; font-weight: 600; }
      a:focus-visible { outline: 3px solid #352722; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">BajiHears</p>
      <h1>You're offline</h1>
      <p>Reconnect to read the Wall or share a thought. Your drafts and saved notes stay on this device.</p>
